# Render "Blueprint": creates the API server on Render's free plan.
# Free plan notes: it sleeps after 15 minutes without visitors and takes up to a minute to wake;
# it has no permanent disk, which is why data lives in Turso and photos in Cloudinary.
services:
  - type: web
    name: mm-kitchen-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to Bangalore
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET           # random, generated by Render
        generateValue: true
      - key: ADMIN_EMAIL          # the owner's admin login (you type these in the Render dashboard)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL   # from turso.tech: libsql://your-db-name.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLOUDINARY_URL       # from cloudinary.com dashboard: cloudinary://KEY:SECRET@CLOUD_NAME
        sync: false
      - key: SITE_URL             # the public website, e.g. https://www.yourdomain.com
        sync: false
      - key: ALLOWED_ORIGINS      # extra websites allowed to call the API, comma separated
        sync: false
